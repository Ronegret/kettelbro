        - heading "Cómo funciona" [level=2] [ref=f99e118]
        - paragraph [ref=f99e119]: Cuatro pasos y estás entrenando.
        - list [ref=f99e120]:
          - listitem [ref=f99e121]:
            - generic [aria-hidden] [ref=f99e122]: "1"
            - generic [ref=f99e123]:
              - heading "Entra con Google" [level=3] [ref=f99e124]
              - paragraph [ref=f99e125]: "Un toque y listo: sin contraseñas que recordar. Tu cuenta guarda tu historial para que lo encuentres igual en cualquier teléfono."
          - listitem [ref=f99e126]:
            - generic [aria-hidden] [ref=f99e127]: "2"
            - generic [ref=f99e128]:
              - heading "Cuéntanos de ti" [level=3] [ref=f99e129]
              - paragraph [ref=f99e130]: "Tu nivel, tu meta, cuánto tiempo tienes (10, 15, 20 o 25 minutos) y qué pesas rusas hay en tu casa. Si quieres, también tu estatura y tu peso, para sugerirte una pesa de partida. Antes de entrenar te hacemos unas preguntas de salud: si marcas señales de alarma, te pedimos consultar a un profesional."
          - listitem [ref=f99e131]:
            - generic [aria-hidden] [ref=f99e132]: "3"
            - generic [ref=f99e133]:
              - heading "Recibe tu sesión del día" [level=3] [ref=f99e134]
              - paragraph [ref=f99e135]: "Cada día sale una sesión con tu rutina: calentamiento, bloques de trabajo y vuelta a la calma, armada para el tiempo que elegiste y solo con las pesas que tienes. Puedes ver por qué te toca cada bloque y qué estudio lo respalda."
          - listitem [ref=f99e136]:
            - generic [aria-hidden] [ref=f99e137]: "4"
            - generic [ref=f99e138]:
              - heading "Entrena con tu acompañante" [level=3] [ref=f99e139]
              - paragraph [ref=f99e140]: "La pantalla te guía por cada serie, descanso y repetición, con cuenta regresiva y reloj. No hay botón de «ya terminé»: la app lleva el tiempo y tú solo levantas. Al terminar nos cuentas qué tan duro fue, y la app ajusta el día siguiente."
    - region [ref=f99e141]:
      - generic [ref=f99e142]:
        - heading "Por qué es distinto" [level=2] [ref=f99e143]
        - list [ref=f99e144]:
          - listitem [ref=f99e145]:
            - heading "Cada día, una sesión distinta" [level=3] [ref=f99e146]
            - paragraph [ref=f99e147]: "En vez de una lista infinita de rutinas, recibes una sesión por día, y el mes es un plan que se va marcando día a día. Tu rutina no es aleatoria: se genera con reglas fijas a partir de tu día de programa, rota los ejercicios sin repetirlos de golpe y cambia de enfoque (fuerza, potencia, resistencia, técnica y recuperación)."
          - listitem [ref=f99e148]:
            - heading "Ciencia verificada, con sus límites" [level=3] [ref=f99e149]
            - paragraph [ref=f99e150]: "Más de 70 referencias revisadas una por una contra PubMed, su DOI o la fuente original. Cada bloque de tu rutina puede mostrar su respaldo y su nivel de evidencia (de A a D). Y lo que la evidencia no sostiene, no lo prometemos: ni quema de grasa garantizada ni «tonificar»."
          - listitem [ref=f99e151]:
            - heading "Un acompañante en cada serie" [level=3] [ref=f99e152]
            - paragraph [ref=f99e153]: Texto y botones grandes para leer a distancia, cuenta regresiva antes de cada serie, repeticiones contadas por el reloj y cronómetro de descansos. Voz, sonido y vibración son opcionales. Si cierras la app a mitad de la sesión, retomas donde la dejaste.
          - listitem [ref=f99e154]:
            - heading "Sesiones de 10 a 25 minutos" [level=3] [ref=f99e155]
            - paragraph [ref=f99e156]: "Tú eliges 10, 15, 20 o 25 minutos y la sesión dura exactamente eso, con el calentamiento y las preparaciones incluidos: si dice 20, son 20. Es una decisión de diseño con respaldo indirecto: en un meta-análisis de entrenamiento de fuerza en general, una sola serie por ejercicio, de una a tres veces por semana, se asoció con aumentos de fuerza en hombres entrenados."
          - listitem [ref=f99e157]:
            - heading "Tu historial viaja contigo" [level=3] [ref=f99e158]
            - paragraph [ref=f99e159]: "Entras con tu cuenta de Google y encuentras tus pesos, repeticiones, récords y rachas tal cual los dejaste, en cualquier teléfono. Si no entrenas por unos días, no pierdes bloques ni te castigamos: el programa avanza cuando completas tu sesión."
    - region [ref=f99e160]:
      - generic [ref=f99e161]:
        - heading "La ciencia sin humo" [level=2] [ref=f99e162]
        - paragraph [ref=f99e163]: "Nos tomamos en serio lo que se sabe y lo que no. Estas cuatro frases salen de estudios concretos, con sus límites. Y recuerda: la evidencia específica de pesa rusa es todavía pequeña."
        - list [ref=f99e164]:
          - listitem [ref=f99e165]:
            - paragraph [ref=f99e166]: En un ensayo con 21 hombres sanos, seis semanas de swings con pesa rusa, dos días por semana, se asociaron con mejoras en la fuerza de piernas (media sentadilla) y en el salto vertical. No hubo grupo inactivo, así que parte de la mejora puede deberse al aprendizaje.
            - paragraph [ref=f99e167]:
              - generic [ref=f99e168]: Nivel B
              - link "Lake y Lauder, 2012 · J Strength Cond Res" [ref=f99e169] [cursor=pointer]:
                - /url: https://pubmed.ncbi.nlm.nih.gov/22580981/
              - generic [ref=f99e170]: Ensayo aleatorizado con dos grupos activos (n = 21)
          - listitem [ref=f99e171]:
            - paragraph [ref=f99e172]: A igual esfuerzo percibido, correr en cinta exigió entre un 25 y un 39 % más de consumo de oxígeno que 10 minutos de swings (13 personas). La pesa rusa puede ser un buen ejercicio cardiovascular, pero no hay evidencia de que sea mejor que correr.
            - paragraph [ref=f99e173]:
              - generic [ref=f99e174]: Nivel C
              - link "Hulsey y cols., 2012 · J Strength Cond Res" [ref=f99e175] [cursor=pointer]:
                - /url: https://pubmed.ncbi.nlm.nih.gov/22395274/
              - generic [ref=f99e176]: Estudio cruzado de laboratorio (n = 13)
          - listitem [ref=f99e177]:
            - paragraph [ref=f99e178]: En un meta-análisis de 6 estudios con hombres entrenados, una sola serie por ejercicio, de una a tres veces por semana, aumentó la fuerza máxima. Es evidencia de entrenamiento de fuerza en general, no específica de pesa rusa.
            - paragraph [ref=f99e179]:
              - generic [ref=f99e180]: Nivel A
              - link "Androulakis-Korakakis y cols., 2020 · Sports Med" [ref=f99e181] [cursor=pointer]:
                - /url: https://pubmed.ncbi.nlm.nih.gov/31797219/
              - generic [ref=f99e182]: Revisión sistemática con meta-análisis (6 estudios)
          - listitem [ref=f99e183]:
            - paragraph [ref=f99e184]: Una revisión de 99 publicaciones concluyó que los efectos del entrenamiento con pesa rusa son típicamente de triviales a pequeños y que la confianza en esos resultados es de baja a muy baja. Por eso verás «puede» y «en estudios pequeños» en vez de promesas.
            - paragraph [ref=f99e185]:
              - generic [ref=f99e186]: Nivel D
              - link "Meigh y cols., 2019 · BMC Sports Sci Med Rehabil" [ref=f99e187] [cursor=pointer]:
                - /url: https://pubmed.ncbi.nlm.nih.gov/31497302/
              - generic [ref=f99e188]: Revisión de alcance (99 publicaciones)
        - paragraph [ref=f99e189]: "A: meta-análisis o posición oficial sobre entrenamiento de fuerza en general. B: ensayo controlado con pesa rusa. C: laboratorio agudo, biomecánica o EMG. D: consenso de expertos, encuesta o caso clínico."
        - generic [ref=f99e190]:
          - heading "Lo que no prometemos" [level=3] [ref=f99e191]
          - list [ref=f99e192]:
            - listitem [ref=f99e193]: Quemar grasa o «tonificar» zonas del cuerpo.
            - listitem [ref=f99e195]: Que la pesa rusa queme más que correr o reemplace al gimnasio.
            - listitem [ref=f99e197]: Curar o proteger la espalda.
            - listitem [ref=f99e199]: "Cifras exactas de calorías: un MET es un promedio, no tu caso."

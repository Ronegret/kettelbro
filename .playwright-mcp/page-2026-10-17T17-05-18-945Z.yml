      - generic [ref=f99e222]:
        - heading "Instala kettellbro en tu teléfono" [level=2] [ref=f99e223]
        - paragraph [ref=f99e224]: Se instala como una app más, sin tienda y sin ocupar casi espacio. Así la abres con un toque, a pantalla completa.
        - generic [ref=f99e225]:
          - generic [ref=f99e226]:
            - heading "En Android (Chrome)" [level=3] [ref=f99e227]
            - list [ref=f99e228]:
              - listitem [ref=f99e229]: Abre kettellbro.vercel.app en Chrome.
              - listitem [ref=f99e230]: Toca el menú de los tres puntos, arriba a la derecha.
              - listitem [ref=f99e231]: Elige «Instalar app» o «Agregar a la pantalla principal». El nombre cambia según tu versión de Chrome y tu idioma.
              - listitem [ref=f99e232]: Confirma con «Instalar» o «Agregar».
              - listitem [ref=f99e233]: Abre kettellbro desde el ícono nuevo de tu pantalla de inicio y entra con Google.
            - paragraph [ref=f99e234]: Si no ves ninguna de las dos opciones, recarga la página o actualiza Chrome.
          - generic [ref=f99e235]:
            - heading "En iPhone (Safari)" [level=3] [ref=f99e236]
            - list [ref=f99e237]:
              - listitem [ref=f99e238]: Abre kettellbro.vercel.app en Safari.
              - listitem [ref=f99e239]: Toca el botón Compartir (el cuadrado con una flecha hacia arriba).
              - listitem [ref=f99e240]: Desliza y elige «Agregar a pantalla de inicio». En algunos idiomas aparece como «Añadir a pantalla de inicio».
              - listitem [ref=f99e241]: Si ves el interruptor «Abrir como app web», déjalo activado para que se abra a pantalla completa.
              - listitem [ref=f99e242]: Toca «Agregar».
              - listitem [ref=f99e243]: Abre el ícono nuevo y entra con Google.
            - paragraph [ref=f99e244]: Instálala desde Safari. Desde otros navegadores las opciones pueden variar.
        - group [ref=f99e245]:
          - generic "En computador (Chrome)" [ref=f99e246] [cursor=pointer]
